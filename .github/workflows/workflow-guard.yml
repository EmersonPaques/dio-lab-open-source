name: Workflow Guard

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed workflow files
        id: diff
        run: |
          BASE="${{ github.event.before || github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.after || github.sha }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git show --name-only --pretty="" "$HEAD" -- .github/workflows/ 2>/dev/null || true)
          else
            CHANGED=$(git diff --name-only "$BASE" "$HEAD" -- .github/workflows/ 2>/dev/null || true)
          fi
          {
            echo "changed<<GUARD_EOF"
            echo "$CHANGED"
            echo "GUARD_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Scan for exfiltration signature
        id: scan
        if: steps.diff.outputs.changed != ''
        run: |
          SUSPECT=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ "$(basename "$f")" = "workflow-guard.yml" ] && continue
            [ -f "$f" ] || continue
            if grep -Eiq '(curl|wget).{0,300}(secrets\.|toJSON\(secrets\))' "$f"; then
              SUSPECT="$SUSPECT $f"
            fi
          done <<< "${{ steps.diff.outputs.changed }}"
          echo "suspect=$SUSPECT" >> "$GITHUB_OUTPUT"

      - name: Alert
        if: steps.diff.outputs.changed != ''
        uses: actions/github-script@v7
        env:
          CHANGED: ${{ steps.diff.outputs.changed }}
          SUSPECT: ${{ steps.scan.outputs.suspect }}
        with:
          script: |
            const changed = (process.env.CHANGED || '').trim();
            const suspect = (process.env.SUSPECT || '').trim();
            const isPR = context.eventName === 'pull_request';
            const ref = context.payload.after || context.sha;
            const title = suspect
              ? `🚨 Possível workflow malicioso detectado — remova manualmente`
              : `⚠️ Mudança em .github/workflows detectada${isPR ? ' (Pull Request)' : ''}`;
            const removeCmds = suspect
              ? suspect.split(/\s+/).filter(Boolean).map(p =>
                  `gh api -X DELETE "repos/${context.repo.owner}/${context.repo.repo}/contents/${p}" -f message="security: remove malicious workflow" -f sha=$(gh api "repos/${context.repo.owner}/${context.repo.repo}/contents/${p}" --jq '.sha')`
                ).join('\n')
              : '';
            const body = [
              `**Evento:** ${context.eventName}`,
              `**Ator:** ${context.actor}`,
              `**Commit/SHA:** ${ref}`,
              `**Arquivos alterados em .github/workflows/:**\n${changed || '(nenhum)'}`,
              suspect ? `\n**⚠️ Assinatura de exfiltração de secrets encontrada em:**\n${suspect}` : '',
              suspect ? `\n**Este vigia NÃO remove automaticamente** (o GITHUB_TOKEN não pode editar arquivos de workflow por design do GitHub). Rode isto pra remover:\n\`\`\`bash\n${removeCmds}\n\`\`\`` : ''
            ].join('\n');
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['security'] });

      - name: Notify Telegram
        if: steps.diff.outputs.changed != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.GUARD_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.GUARD_TELEGRAM_CHAT_ID }}
          SUSPECT: ${{ steps.scan.outputs.suspect }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram não configurado neste repositório, pulando."
            exit 0
          fi
          if [ -n "$SUSPECT" ]; then
            MSG="🚨 ${{ github.repository }}: workflow malicioso detectado ($SUSPECT) por ${{ github.actor }}. Veja a Issue de seguranca no repo AGORA."
          else
            MSG="⚠️ ${{ github.repository }}: mudanca em .github/workflows por ${{ github.actor }}. Veja as Issues do repositorio."
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" -d text="$MSG" >/dev/null
